<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Ultimate Calculator — a premium mathematical workspace.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title> Calculator</title>
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <button class="brand" data-route="dashboard" aria-label="Go to dashboard">
        <span class="brand-mark">√</span><span> <b>CALCULATOR</b></span>
      </button>
      <div class="top-actions">
        <button class="search-trigger" id="searchTrigger" aria-label="Global search">⌕ <span>Search anything</span><kbd>Ctrl K</kbd></button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☼</button>
        <button class="icon-btn" data-route="settings" aria-label="Open settings">⚙</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Primary navigation">
      <div class="nav-group">
        <p>WORKSPACE</p>
        <div class="dashboard-nav">
          <button data-route="dashboard"><span>Dashboard</span></button>
          <button class="dashboard-toggle" type="button" data-dashboard-toggle aria-expanded="true" aria-label="Show calculator and notes menu"><span class="nav-chevron">▾</span></button>
        </div>
        <div class="nav-submenu open" id="dashboardSubmenu">
          <button data-route="calculator"><span class="submenu-icon">▣</span><span>Basic Calculator</span></button>
          <button data-route="scientific"><span class="submenu-icon">∿</span><span>Scientific</span></button>
          <button data-route="notes"><span class="submenu-icon">✎</span><span>Math Notes</span></button>
        </div>
        <button data-route="converter">⇄ <span>Converter</span></button>
      </div>
      <div class="nav-group">
        <p>LIBRARY</p>
        <button data-route="history">◷ <span>History</span></button>
        <button data-route="favorites">☆ <span>Favorites</span></button>
      </div>
      <div class="nav-group bottom-nav">
        <button data-route="settings">⚙ <span>Settings</span></button>
        <button data-route="help">? <span>Help</span></button>
      </div>
    </aside>

    <main id="main" tabindex="-1"></main>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button data-route="calculator">▣<span>Calc</span></button>
      <button data-route="scientific">∿<span>Science</span></button>
      <button data-route="notes">✎<span>Notes</span></button>
      <button data-route="converter">⇄<span>Convert</span></button>
      <button data-route="history">◷<span>History</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
